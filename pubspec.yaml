name: llm_replay_eval
description: >-
  Deterministic record/replay (cassettes) and eval matchers for on-device LLM
  inference in Flutter. Fast, offline, byte-identical AI-feature tests.
version: 0.1.0
repository: https://github.com/Umer9538/llm_replay_eval
issue_tracker: https://github.com/Umer9538/llm_replay_eval/issues
topics:
  - llm
  - testing
  - ai
  - on-device
  - mocking

environment:
  sdk: ^3.11.5
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  # This is a testing package: it ships flutter_test Matcher adapters, so
  # flutter_test is a real (SDK) dependency, as in alchemist and similar tools.
  flutter_test:
    sdk: flutter
  crypto: ^3.0.0

dev_dependencies:
  flutter_lints: ^6.0.0

